<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Document</title>
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link href="./css/theme.css" rel="stylesheet" />
  <!-- Color Schemes-->
  <link data-theme="system" media="(prefers-color-scheme: light)" href="./css/theme.latte.css" rel="stylesheet" />
  <link data-theme="system" media="(prefers-color-scheme: light)" href="https://prismjs.catppuccin.com/latte.css"
    rel="stylesheet" />
  <link data-theme="system" media="(prefers-color-scheme: dark)" href="./css/theme.mocha.css" rel="stylesheet" />
  <link data-theme="system" media="(prefers-color-scheme: dark)" href="https://prismjs.catppuccin.com/mocha.css"
    rel="stylesheet" />
  <link data-theme="latte" disabled href="./css/theme.latte.css" rel="stylesheet" />
  <link data-theme="latte" disabled href="https://prismjs.catppuccin.com/latte.css" rel="stylesheet" />
  <link data-theme="mocha" disabled href="./css/theme.mocha.css" rel="stylesheet" />
  <link data-theme="mocha" disabled href="https://prismjs.catppuccin.com/mocha.css" rel="stylesheet" />
  <link data-theme="frappe" disabled href="./css/theme.frappe.css" rel="stylesheet" />
  <link data-theme="frappe" disabled href="https://prismjs.catppuccin.com/frappe.css" rel="stylesheet" />
  <link data-theme="machiatto" disabled href="./css/theme.machiatto.css" rel="stylesheet" />
  <link data-theme="machiatto" disabled href="https://prismjs.catppuccin.com/machiatto.css" rel="stylesheet" />

  <!-- Plugins -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/plugins/command-line/prism-command-line.min.css">
  <script src="https://kit.fontawesome.com/6cfe16cf2a.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">
</head>

<body class="sidebar-chevron-right">
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Bonsai',
      repo: 'https://github.com/elizabethlfransen/bonsai-cli',
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 2,
      relativePath: true,
      homepage: 'user/install.md',
      noData: {
        '/': 'No results!',
      },
      paths: 'auto',
      placeholder: {
        '/': 'Search',
      },
      depth: 6,
      plugins: [
        (hook) => hook.doneEach(() => {
          const sidebar = document.querySelector('.sidebar-nav');

          registerThemeSelector(sidebar);
        }),
        (hook) => hook.doneEach(() => {
          // bashify our shells
          document
            .querySelectorAll(`pre[data-lang="bash"], pre[data-lang="shell"]`)
            .forEach(codeBlock => {
              codeBlock.classList.add("command-line")
              codeBlock.dataset.prompt="$"
            });
          Prism.highlightAll();
        })
      ]
    }
    function waitForElement(selector) {
      return new Promise((resolve) => {
        // Check if the element is already in the DOM
        const element = document.querySelector(selector);
        if (element) {
          return resolve(element);
        }

        // Observe the DOM for changes
        const observer = new MutationObserver((mutations, obs) => {
          const el = document.querySelector(selector);
          if (el) {
            obs.disconnect(); // Stop observing
            resolve(el); // Return the element
          }
        });

        // Watch the entire document for added nodes
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      });
    }


    function getOS() {
      if (navigator.userAgentData && navigator.userAgentData.platform) {
        const platform = navigator.userAgentData.platform.toLowerCase();

        if (platform.includes('windows')) return 'Windows';
        if (platform.includes('macos')) return 'Mac';
        if (platform.includes('linux')) return 'Linux';
      }
      const userAgent = navigator.userAgent.toLowerCase();

      if (userAgent.includes('win')) return 'Windows';
      if (userAgent.includes('mac')) return 'Mac';
      if (userAgent.includes('linux')) return 'Linux';

      return 'Other';
    }
    waitForElement("#downloadButton").then((button) => {
      const icon = document.createElement("i");
      icon.classList.add('fa-brands', 'fa-xl');
      switch (getOS()) {
        case "Windows":
          icon.classList.add("fa-windows");
          button.href = "https://github.com/elizabethlfransen/bonsai-cli/releases/download/nightly/bonsai-windows-x86_64.zip";
          break;
        case "Mac":
          icon.classList.add("fa-apple");
          button.href = "https://github.com/elizabethlfransen/bonsai-cli/releases/download/nightly/bonsai-mac-arm64.tar.gz";
          break;
        case "Linux":
          icon.classList.add("fa-linux");
          button.href = "https://github.com/elizabethlfransen/bonsai-cli/releases/download/nightly/bonsai-linux-x86_64.tar.gz";
          break;
        default:
          icon.remove();
          break;
      }

      button.prepend(icon);
    });

    function registerThemeSelector(sidebar) {
      const sidebar_footer = document.createElement('div');
      sidebar_footer.className = "sidebar-bottom";
      sidebar_footer.innerHTML = `
        <i style="padding: 8px;" class="fa-solid fa-paintbrush" aria-label="theme" aria-label-for="theme"></i>
        <select onchange="updateTheme(this.value)" style="flex-grow: 1;" id="theme">
          <option value="system">System</option>
          <option value="frappe">Frappe</option>
          <option value="latte">Latte</option>
          <option value="machiatto">Machiatto</option>
          <option value="mocha">Mocha</option>
        </select>
      `;
      const themeSelect = sidebar_footer.querySelector("#theme");

      const initialTheme = localStorage.getItem("theme") ?? 'system';
      updateTheme(initialTheme);
      themeSelect.value = initialTheme;
      sidebar.appendChild(sidebar_footer);
    }

    function enableStyleSheet(sheet) {
      return new Promise((resolve, reject) => {
        let resolved = false;
        sheet.addEventListener('load', () => {
          if (!resolved) {
            resolved = true;
            requestAnimationFrame(() => resolve());
          }
        }, { once: true });
        sheet.disabled = false;
        if (!resolved) {
          resolved = true;
          requestAnimationFrame(() => resolve());
        }
      })
    }

    function enableTheme(theme) {
      return Promise.allSettled([...document.querySelectorAll(`[data-theme="${theme}"]`)].map(enableStyleSheet));
    }

    function updateTheme(value) {
      localStorage.setItem("theme", value);
      const selector = `[data-theme="${value}"]`;
      enableTheme(value).then(() => {
        document.querySelectorAll(`[data-theme]:not(${selector})`).forEach((themeSheet) => themeSheet.disabled = true)
      });

    }
    // fix collapsible list items

  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/plugins/command-line/prism-command-line.min.js"></script>
</body>

</html>
