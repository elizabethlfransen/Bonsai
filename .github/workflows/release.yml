name: Official Stable Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: bonsai
            artifact_name: bonsai-linux-x86_64.tar.gz 
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: bonsai
            artifact_name: bonsai-mac-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: bonsai.exe
            artifact_name: bonsai-windows-x86_64.zip 

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary into archive
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/
          
          if [[ "${{ matrix.artifact_name }}" == *.zip ]]; then
            powershell.exe -Command "Compress-Archive -Path '${{ matrix.binary_name }}' -DestinationPath '../../../${{ matrix.artifact_name }}' -Force"
          else
            tar -czf ../../../${{ matrix.artifact_name }} ${{ matrix.binary_name }}
          fi

      - name: Upload Binary Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Verify Version Alignment
        run: |
          RAW_TAG=${{ github.event.release.tag_name }}
          CLEAN_VERSION=${RAW_TAG#v} 
          cargo set-version "$CLEAN_VERSION"

      - name: Run Cargo Publish
        run: cargo publish --token ${{ secrets.CRATES_TOKEN }}