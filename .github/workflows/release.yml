name: Official Stable Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: bonsai
            artifact_name: bonsai-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: bonsai
            artifact_name: bonsai-mac-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: bonsai.exe
            artifact_name: bonsai-windows-x86_64.exe

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Unique Binary Name
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/${{ matrix.binary_name }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload Binary Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Verify Version Alignment
        run: |
          RAW_TAG=${{ github.event.release.tag_name }}
          CLEAN_VERSION=${RAW_TAG#v} 
          cargo set-version "$CLEAN_VERSION"

      - name: Run Cargo Publish
        run: cargo publish --token ${{ secrets.CRATES_TOKEN }}