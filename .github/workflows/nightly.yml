name: Nightly Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'       
      - 'main.ts'      
      - 'deno.json*'  
jobs:
  nightly:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-pc-windows-msvc]
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: -linux-x64
          - target: aarch64-apple-darwin
            suffix: -macos-arm64
          - target: x86_64-pc-windows-msvc
            suffix: -windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          force-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile
        run: deno compile -P=default --target ${{ matrix.target }} --output ./bonsai${{ matrix.suffix }} --frozen src/main.ts
      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          prerelease: true
          files: ./bonsai*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}