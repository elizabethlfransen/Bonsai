name: Nightly Binary Release

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: bonsai
            artifact_name: bonsai-linux-x86_64.tar.gz 
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: bonsai
            artifact_name: bonsai-mac-arm64.tar.gz 
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: bonsai.exe
            artifact_name: bonsai-windows-x86_64.zip

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          toolchain: nightly

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/
          if [[ "${{ matrix.artifact_name }}" == *.zip ]]; then
            powershell.exe -Command "Compress-Archive -Path '${{ matrix.binary_name }}' -DestinationPath '../../../${{ matrix.artifact_name }}' -Force"
          else
            tar -czf ../../../${{ matrix.artifact_name }} ${{ matrix.binary_name }}
          fi

      - name: Upload Binary Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (Bleeding Edge)"
          body: |
            Automated development builds compiled from the latest `main` branch commit.
            Commit: `${{ github.sha }}`
          prerelease: true
          make_latest: false
          files: ${{ matrix.artifact_name }}   # Point straight to root archive path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}