name: Nightly Binary Release

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: bonsai
            artifact_name: bonsai-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: bonsai
            artifact_name: bonsai-mac-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: bonsai.exe
            artifact_name: bonsai-windows-x86_64.exe

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}


      - name: Prepare Unique Binary Name
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/${{ matrix.binary_name }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
      - name: Upload Binary Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (Bleeding Edge)"
          body: |
            Automated development builds compiled from the latest `main` branch commit.
            Commit: `${{ github.sha }}`
          prerelease: true
          make_latest: false
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}